[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "l-hub"
version = "0.1.0"
description = "A modern Linux peripheral manager for mice, headsets, keyboards, and RGB"
authors = [
    { name = "Lukas" }
]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
l-hub = "lhub.main:run"

[project.urls]
Homepage = "https://github.com/lukas/l-hub"
Repository = "https://github.com/lukas/l-hub"

[tool.setuptools.packages.find]
where = ["."]
include = ["lhub*"]

[tool.setuptools.package-data]
lhub = ["qml/*.qml"]
